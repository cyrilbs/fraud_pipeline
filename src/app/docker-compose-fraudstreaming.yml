version: "3.9"

services:
  spark-driver:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: spark-driver
    hostname: spark-driver
    user: root

    environment:
      - SPARK_PUBLIC_DNS=localhost

    volumes:
      - ../..:/project
      - ivy-cache:/project/.ivy2

    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.ui.host=0.0.0.0
      --conf spark.driver.host=spark-driver
      --conf spark.driver.bindAddress=0.0.0.0
      --conf spark.jars.ivy=/app/.ivy2
      --conf spark.cassandra.connection.host=cassandra
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
      /project/src/app/fraud_streaming.py

    networks:
      - data-platform-net

  alert-service:
    image: python:3.11-slim
    container_name: alert-service

    volumes:
      - ../..:/project

    command: >
      bash -c "pip install kafka-python requests && python -u /project/src/app/alert_service.py"

    networks:
      - data-platform-net

volumes:
  ivy-cache:

networks:
  data-platform-net:
    external: true
